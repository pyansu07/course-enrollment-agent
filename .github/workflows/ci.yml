name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi "uvicorn[standard]" pydantic langgraph \
            langgraph-checkpoint-sqlite aiosqlite langchain-openai python-dotenv \
            "chromadb>=1.5.9,<2.0.0" langchain-huggingface sentence-transformers \
            pytest httpx anyio ruff

      - name: Lint (ruff)
        run: ruff check app/ embedding/ tests/ evaluation/

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build Docker image (validation only — not pushed)
        run: docker build -t ci-validate:${{ github.sha }} .
