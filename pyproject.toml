[project]
name = "course-enrollment-agent"
version = "0.2.0"
description = "Course Enrollment Assistant - FastAPI + LangGraph + OpenAI ChatGPT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "langgraph>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",
    "langchain-openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "chromadb>=1.5.9,<2.0.0",
    # Local embeddings — no API key, no per-query cost. Pulls torch.
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28.0",
    "anyio>=4.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/llm/prompts.py" = ["E501"]   # LLM prompts - breaking lines alters prompt text
# Holds the frozen pre-fix router prompt; reflowing it would change the baseline
# being measured, so the same exemption applies.
"evaluation/skill_router_eval.py" = ["E501"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:langchain_core.*",
]

[tool.ruff.format]
quote-style = "double"
