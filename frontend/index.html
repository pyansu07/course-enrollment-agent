<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Course Enrollment Assistant</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e3e3e6;
    --text: #1a1a1a;
    --muted: #6b6b70;
    --user: #2563eb;
    --user-text: #ffffff;
    --assistant: #eef0f3;
    --error: #dc2626;
    --confirm: #b45309;
    --confirm-bg: #fef3c7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 12px;
  }
  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 48px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }
  header p {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  #status-badge {
    display: inline-block;
    margin-top: 8px;
    font-size: 12px;
    color: var(--confirm);
    background: var(--confirm-bg);
    padding: 2px 8px;
    border-radius: 999px;
  }
  #status-badge[hidden] { display: none; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--assistant);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    background: #fee2e2;
    color: var(--error);
  }
  .msg.typing { color: var(--muted); font-style: italic; }
  #confirm-actions {
    display: flex;
    gap: 8px;
    padding: 0 20px 12px;
  }
  #confirm-actions[hidden] { display: none; }
  #confirm-actions button {
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  #confirm-actions button:hover { background: var(--bg); }
  form {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--user); }
  button[type="submit"] {
    padding: 10px 18px;
    border: none;
    border-radius: 999px;
    background: var(--user);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Course Enrollment Assistant</h1>
      <p>Ask about courses, enroll, or check enrollment status.</p>
      <span id="status-badge" hidden>Awaiting enrollment confirmation</span>
    </header>

    <div id="messages"></div>

    <div id="confirm-actions" hidden>
      <button type="button" id="yes-btn">Yes, confirm</button>
      <button type="button" id="no-btn">No, cancel</button>
    </div>

    <form id="chat-form">
      <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    // Backend base URL — the live Render deployment.
    const API_URL = "https://course-enrollment-agent.onrender.com/chat";

    // One session_id per browser, persisted across page reloads so a
    // multi-turn conversation (and the enroll -> confirm HITL flow, which
    // spans two separate /chat calls) survives a refresh.
    function getSessionId() {
      let id = localStorage.getItem("session_id");
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem("session_id", id);
      }
      return id;
    }
    const sessionId = getSessionId();

    // True right after a draft-enrollment message comes back, until the
    // user's next message resolves it (confirm or cancel). The backend
    // doesn't expose this as a field on the response — it's inferred from
    // the exact confirmation prompt text prepare_enrollment always sends.
    let awaitingConfirmation = false;

    const messagesEl = document.getElementById("messages");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("chat-input");
    const statusEl = document.getElementById("status-badge");
    const confirmActionsEl = document.getElementById("confirm-actions");

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function setAwaitingConfirmation(value) {
      awaitingConfirmation = value;
      statusEl.hidden = !value;
      confirmActionsEl.hidden = !value;
      inputEl.placeholder = value ? "Type yes or no..." : "Type a message...";
    }

    async function sendMessage(text) {
      addMessage("user", text);
      inputEl.value = "";
      inputEl.disabled = true;
      confirmActionsEl.hidden = true;

      const typingEl = addMessage("assistant typing", "...");

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        typingEl.remove();

        if (!res.ok) {
          addMessage("assistant error", `Server error (${res.status}). Please try again.`);
          setAwaitingConfirmation(false);
          return;
        }

        const data = await res.json();
        addMessage("assistant", data.answer);

        const askingToConfirm = data.answer.includes(
          "Would you like to confirm this enrollment?"
        );
        setAwaitingConfirmation(askingToConfirm);
      } catch (err) {
        typingEl.remove();
        addMessage(
          "assistant error",
          "Couldn't reach the server. The backend is on Render's free tier and " +
            "spins down after inactivity — if this is the first message in a " +
            "while, wait ~30s for it to wake up and try again."
        );
      } finally {
        inputEl.disabled = false;
        inputEl.focus();
      }
    }

    formEl.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = inputEl.value.trim();
      if (!text) return;
      sendMessage(text);
    });

    document.getElementById("yes-btn").addEventListener("click", () => sendMessage("yes"));
    document.getElementById("no-btn").addEventListener("click", () => sendMessage("no"));

    inputEl.focus();
  </script>
</body>
</html>
